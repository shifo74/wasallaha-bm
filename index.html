<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مؤقت تفاعلي متطور</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #12121e;
      transition: background 0.5s ease;
      overflow-x: hidden;
      padding: 20px 0;
      position: relative;
      color: #fff;
    }

    /* أشكال ديكورية في الخلفية */
    .bg-shape {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 1;
      opacity: 0.5;
      transition: all 0.6s ease;
    }

    .shape-1 {
      width: 320px;
      height: 320px;
      top: 10%;
      right: 15%;
      background: #ff4757;
    }

    .shape-2 {
      width: 280px;
      height: 280px;
      bottom: 10%;
      left: 15%;
      background: #ff6b81;
    }

    /* الحاوية الرئيسية العمودية */
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      z-index: 10;
      width: 340px;
      align-items: center;
    }

    /* كارت المؤقت */
    .timer-card {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 35px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 100%;
    }

    /* عرض الوقت */
    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 2px;
      text-shadow: 0 4px 15px rgba(0,0,0,0.4);
      font-family: monospace;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* أزرار التحكم */
    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1.05rem;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .btn-toggle {
      background: linear-gradient(135deg, #ff4757, #ff6b81);
      box-shadow: 0 8px 20px rgba(255, 47, 87, 0.3);
    }

    .btn-reset {
      background: linear-gradient(135deg, #747d8c, #57606f);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    .btn-history-toggle {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eccc68;
    }

    .btn:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .btn:active {
      transform: translateY(1px) scale(0.98);
    }

    /* كارت السجل (تحت المؤقت) */
    .history-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      width: 100%;
      display: none; /* مخفي افتراضياً */
      flex-direction: column;
      animation: slideDown 0.4s ease forwards;
    }

    .history-card.show {
      display: flex;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .history-card h3 {
      font-size: 1rem;
      margin-bottom: 12px;
      color: #eccc68;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 6px;
      text-align: center;
    }

    .history-list {
      list-style: none;
      overflow-y: auto;
      max-height: 160px;
      padding-left: 5px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .history-item {
      background: rgba(255, 255, 255, 0.08);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 8px;
      font-size: 0.95rem;
      font-family: monospace;
      display: flex;
      justify-content: space-between;
    }

    .empty-msg {
      text-align: center;
      color: #aaa;
      font-size: 0.85rem;
      padding: 10px 0;
    }

    .btn-clear {
      background: transparent;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      color: #aaa;
      padding: 6px;
      font-size: 0.8rem;
      border-radius: 8px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-clear:hover { color: #fff; border-color: #fff; }

    /* تأثيرات حالة التشغيل */
    .running .shape-1 {
      background: #2ed573;
      transform: scale(1.3) rotate(45deg);
    }

    .running .shape-2 {
      background: #7bed9f;
      transform: scale(1.3) rotate(-45deg);
    }

    .running .btn-toggle {
      background: linear-gradient(135deg, #2ed573, #26af5f);
      box-shadow: 0 8px 20px rgba(46, 213, 115, 0.4);
    }

    /* الأشكال المتطايرة عند الضغط */
    .floating-shape {
      position: absolute;
      pointer-events: none;
      font-size: 1.8rem;
      user-select: none;
      animation: floatUp 1s ease-out forwards;
      z-index: 100;
    }

    @keyframes floatUp {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.5) rotate(0deg);
      }
      50% {
        transform: translate(calc(-50% + var(--x)), calc(-50% - 60px)) scale(1.4) rotate(180deg);
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--x)), calc(-50% - 120px)) scale(0.8) rotate(360deg);
      }
    }
  </style>
</head>
<body id="body">

  <div class="bg-shape shape-1"></div>
  <div class="bg-shape shape-2"></div>

  <div class="container">
    <!-- كارت المؤقت الرئيسي -->
    <div class="timer-card">
      <div class="timer-display" id="display">00:00:00</div>
      <div class="actions">
        <button class="btn btn-toggle" id="toggleBtn">تشغيل الوقت</button>
        <button class="btn btn-reset" id="resetBtn">إعادة ضبط</button>
        <button class="btn btn-history-toggle" id="toggleHistoryBtn">عرض السجل (📜)</button>
      </div>
    </div>

    <!-- كارت السجل (يظهر تحته عند الضغط) -->
    <div class="history-card" id="historyCard">
      <h3>الأوقات السابقة</h3>
      <ul class="history-list" id="historyList">
        <li class="empty-msg" id="emptyMsg">لا توجد أوقات مسجلة بعد</li>
      </ul>
      <button class="btn-clear" id="clearBtn">مسح السجل</button>
    </div>
  </div>

  <script>
    let timerInterval = null;
    let seconds = 0;
    let isRunning = false;
    let countIndex = 1;

    const icons = ['✨', '⚡', '🚀', '🎯', '🌟', '💥', '🔥', '🎉', '💎', '🟢', '🔴'];

    const display = document.getElementById('display');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
    const historyCard = document.getElementById('historyCard');
    const historyList = document.getElementById('historyList');
    const emptyMsg = document.getElementById('emptyMsg');
    const clearBtn = document.getElementById('clearBtn');
    const body = document.getElementById('body');

    // تنسيق الوقت
    function formatTime(sec) {
      let hrs = Math.floor(sec / 3600);
      let mins = Math.floor((sec % 3600) / 60);
      let secs = sec % 60;

      return (
        (hrs < 10 ? "0" + hrs : hrs) + ":" +
        (mins < 10 ? "0" + mins : mins) + ":" +
        (secs < 10 ? "0" + secs : secs)
      );
    }

    // إنشاء شكل عشوائي يطير عند الضغط
    function spawnPopUp(event) {
      const el = document.createElement('div');
      el.classList.add('floating-shape');
      
      const randomIcon = icons[Math.floor(Math.random() * icons.length)];
      el.textContent = randomIcon;

      el.style.left = `${event.clientX}px`;
      el.style.top = `${event.clientY}px`;

      const randomX = (Math.random() - 0.5) * 100;
      el.style.setProperty('--x', `${randomX}px`);

      document.body.appendChild(el);

      setTimeout(() => {
        el.remove();
      }, 1000);
    }

    // زر التشغيل والإيقاف
    toggleBtn.addEventListener('click', function(e) {
      spawnPopUp(e);

      if (!isRunning) {
        isRunning = true;
        toggleBtn.textContent = "إيقاف الوقت";
        body.classList.add('running');

        timerInterval = setInterval(() => {
          seconds++;
          display.textContent = formatTime(seconds);
        }, 1000);
      } else {
        isRunning = false;
        toggleBtn.textContent = "تشغيل الوقت";
        body.classList.remove('running');
        clearInterval(timerInterval);

        if (seconds > 0) {
          addHistory(formatTime(seconds));
        }
      }
    });

    // زر إعادة الضبط
    resetBtn.addEventListener('click', function(e) {
      spawnPopUp(e);
      
      isRunning = false;
      clearInterval(timerInterval);
      seconds = 0;
      display.textContent = "00:00:00";
      toggleBtn.textContent = "تشغيل الوقت";
      body.classList.remove('running');
    });

    // زر إظهار/إخفاء السجل
    toggleHistoryBtn.addEventListener('click', function(e) {
      spawnPopUp(e);
      historyCard.classList.toggle('show');

      if (historyCard.classList.contains('show')) {
        toggleHistoryBtn.textContent = "إخفاء السجل (📜)";
      } else {
        toggleHistoryBtn.textContent = "عرض السجل (📜)";
      }
    });

    // إضافة وقت للسجل
    function addHistory(timeStr) {
      if (emptyMsg) {
        emptyMsg.style.display = 'none';
      }
      const li = document.createElement('li');
      li.classList.add('history-item');
      li.innerHTML = `<span>محاولة #${countIndex++}</span> <span>${timeStr}</span>`;
      historyList.prepend(li);
    }

    // مسح السجل
    clearBtn.addEventListener('click', function() {
      historyList.innerHTML = '<li class="empty-msg" id="emptyMsg">لا توجد أوقات مسجلة بعد</li>';
      countIndex = 1;
    });
  </script>
</body>
</html>
